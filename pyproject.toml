[project]
name = "jobagent"
version = "0.1.0"
description = "SelfRecruite: a self-hosted job-search agent that crawls career sites, scores postings against your resume and learns from your marks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["job-search", "langgraph", "langchain", "ollama", "pgvector", "fastapi", "recruiting"]
dependencies = [
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "pgvector",
    "python-dotenv",
    "pydantic>=2",
    "pyyaml",
    "httpx",
    "tenacity",
    "beautifulsoup4",
    "langgraph>=1",
    "langchain>=1",
    "langchain-ollama",
    "langgraph-checkpoint-postgres",
    "mcp",
    "numpy",
    "scikit-learn",
    "joblib",
    "rapidfuzz",
    "fastapi",
    "uvicorn",
    "pillow",
    "ruamel.yaml",
    "cryptography",
    "pwdlib[argon2]",
    "langchain-anthropic",
    "langchain-openai",
]

[project.optional-dependencies]
dev = ["pytest", "py-mini-racer", "playwright"]

[project.urls]
Homepage = "https://github.com/ayjabri/SelfRecruite"
Repository = "https://github.com/ayjabri/SelfRecruite"
Issues = "https://github.com/ayjabri/SelfRecruite/issues"

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobagent*"]

[tool.setuptools.package-data]
jobagent = ["web/*.html", "web/*.png", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network, the database or Ollama"]
addopts = "-m 'not live'"
