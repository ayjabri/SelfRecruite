<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3e8; --text: #1c2330; --muted: #667085;
    --accent: #2f6fde; --yes: #1a8f5a; --yes-bg: #e3f5ec; --no: #c0392b; --no-bg: #fbe9e7;
    --sel: #e8f0fe; --bar: #c9d3e0; --warn: #b26a00; --warn-bg: #fff3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1a1f27; --line: #2c333f; --text: #e6e9ee; --muted: #94a0b3;
      --accent: #6ea0ff; --yes: #4cc38a; --yes-bg: #173327; --no: #f0776a; --no-bg: #3a1f1c;
      --sel: #22304a; --bar: #3a4455; --warn: #f0b354; --warn-bg: #3a2c12;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                          border-radius: 6px; padding: 5px 8px; }
  input[type=search] { width: 200px; }
  input[type=number] { width: 64px; }
  label.f { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #progress { margin-left: auto; color: var(--muted); white-space: nowrap; }
  #progress b { color: var(--text); }
  main { flex: 1; display: flex; min-height: 0; }
  #list { width: 420px; max-width: 45%; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  #detail { flex: 1; overflow-y: auto; padding: 20px 28px 60px; }
  .row { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; }
  .row:hover { background: var(--bg); }
  .row.sel { background: var(--sel); }
  .row .t { font-weight: 600; }
  .row .m { color: var(--muted); font-size: 12.5px; }
  .score { flex: none; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center;
           font-weight: 700; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .score.gated { color: var(--warn); border-color: var(--warn); }
  .row.interested { box-shadow: inset 4px 0 0 var(--yes); }
  .row.not_interested { box-shadow: inset 4px 0 0 var(--no); opacity: .6; }
  .count { padding: 6px 12px; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line); }
  h2 { margin: 0 0 2px; font-size: 20px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .actions { display: flex; gap: 8px; margin: 14px 0 18px; flex-wrap: wrap; align-items: center; }
  .actions button { padding: 7px 14px; cursor: pointer; font-weight: 600; }
  .actions button.yes.on { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); }
  .actions button.no.on { background: var(--no-bg); border-color: var(--no); color: var(--no); }
  .actions a { color: var(--accent); margin-left: 6px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
  .chip.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .comp { display: grid; grid-template-columns: 120px 1fr 44px; gap: 6px 10px; align-items: center; font-size: 13px; }
  .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  ul.b { list-style: none; padding: 0; margin: 0; }
  ul.b li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  ul.b li:first-child { border-top: 0; }
  ul.b .s { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  ul.b .match { color: var(--muted); font-size: 12px; }
  ul.plain { margin: 0; padding-left: 18px; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; font: inherit; margin: 10px 0 0; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  @media (max-width: 800px) { main { flex-direction: column; } #list { width: 100%; max-width: none; height: 40%; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Job review</h1>
  <input type="search" id="q" placeholder="Search title or text">
  <select id="company"><option value="">All companies</option></select>
  <select id="label">
    <option value="all">All jobs</option>
    <option value="unlabelled">Not yet marked</option>
    <option value="interested">Interested</option>
    <option value="not_interested">Not interested</option>
  </select>
  <label class="f">Min score <input type="number" id="min_score" min="0" max="100" value="0"></label>
  <select id="sort"><option value="score">Highest score</option><option value="newest">Newest</option></select>
  <label class="f"><input type="checkbox" id="scope"> include filtered-out jobs</label>
  <div id="progress"></div>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a job on the left.</div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let jobs = [], selected = null;

const money = j => {
  if (j.comp_min == null && j.comp_max == null) return "";
  const f = n => j.comp_period === "hour" ? "$" + n : "$" + Math.round(n / 1000) + "k";
  return f(j.comp_min ?? j.comp_max) + "–" + f(j.comp_max ?? j.comp_min) + (j.comp_period === "hour" ? "/hr" : "");
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadSummary() {
  const s = await api("/api/summary");
  const done = s.interested + s.not_interested;
  $("progress").innerHTML = `<b>${done}</b> of ${s.in_scope} marked · <b>${s.interested}</b> interested · <b>${s.not_interested}</b> not`;
  const sel = $("company"), cur = sel.value;
  sel.innerHTML = '<option value="">All companies</option>' + s.companies.map(c => `<option>${esc(c)}</option>`).join("");
  sel.value = cur;
}

async function loadJobs(keep) {
  const p = new URLSearchParams({
    q: $("q").value, company: $("company").value, label: $("label").value, sort: $("sort").value,
    min_score: $("min_score").value || 0, scope: $("scope").checked ? "all" : "in_scope",
  });
  const data = await api("/api/jobs?" + p);
  jobs = data.jobs;
  renderList(data.total);
  if (keep && jobs.some(j => j.id === selected)) return;
  if (jobs.length) select(jobs[0].id); else { selected = null; $("detail").innerHTML = '<div class="empty">No jobs match these filters.</div>'; }
}

function renderList(total) {
  const shown = jobs.length < total ? `Showing ${jobs.length} of ${total} jobs` : `${total} jobs`;
  $("list").innerHTML = `<div class="count">${shown}</div>` + jobs.map(j => `
    <div class="row ${j.label || ""} ${j.id === selected ? "sel" : ""}" data-id="${j.id}">
      <div class="score ${j.gated ? "gated" : ""}" title="${j.gated ? "Capped by a hard gate" : "Fit score"}">${j.fit_score ?? "–"}</div>
      <div><div class="t">${esc(j.title)}</div>
        <div class="m">${esc(j.company)}${j.location ? " · " + esc(j.location) : ""}</div>
        <div class="m">${[j.seniority !== "unknown" ? j.seniority : "", j.workplace !== "unknown" ? j.workplace : "", money(j)].filter(Boolean).map(esc).join(" · ")}</div>
      </div>
    </div>`).join("");
}

async function select(id) {
  selected = id;
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", +r.dataset.id === id));
  document.querySelector(".row.sel")?.scrollIntoView({block: "nearest"});
  const j = await api("/api/jobs/" + id);
  if (selected !== id) return;
  renderDetail(j);
}

function renderDetail(j) {
  const d = j.fit_details || {}, c = d.components || {};
  const names = {required: "Required match", preferred: "Preferred match", title_family: "Title family", seniority: "Seniority", domain: "Domain"};
  const comps = Object.keys(names).filter(k => k in c).map(k => `
    <div>${names[k]}</div><div class="track"><div class="fill" style="width:${Math.round(c[k] * 100)}%"></div></div><div class="num">${Math.round(c[k] * 100)}</div>`).join("");
  const bullets = label => (d.bullets || []).filter(b => b.label === label);
  const bulletList = bs => `<ul class="b">${bs.map(b => `<li><div class="s">${Math.round(b.score * 100)}</div>
      <div>${esc(b.text)}<div class="match">closest resume section: ${esc(b.matched)} (similarity ${b.similarity})</div></div></li>`).join("")}</ul>`;
  const facts = [
    j.location, j.workplace !== "unknown" && j.workplace, j.seniority !== "unknown" && j.seniority,
    j.employment_type && j.employment_type !== "unknown" && j.employment_type.replace("_", " "),
    j.min_years != null && j.min_years + "+ years", money(j),
    j.visa && j.visa !== "unstated" && "visa sponsorship: " + j.visa,
    j.posted ? "posted " + j.posted : "first seen " + j.first_seen,
  ].filter(Boolean).map(f => `<span class="chip">${esc(f)}</span>`).join("");
  const gates = (d.gates || []).map(g => `<span class="chip warn">capped at 30: ${esc(g)}</span>`).join("");
  const other = (j.sections || []).filter(s => s.label === "responsibilities" || s.label === "other");
  const req = bullets("required"), pref = bullets("preferred");
  $("detail").innerHTML = `
    <h2>${esc(j.title)}</h2>
    <div class="sub">${esc(j.company)}</div>
    <div class="actions">
      <button class="yes ${j.label === "interested" ? "on" : ""}" data-label="interested">Interested <kbd>I</kbd></button>
      <button class="no ${j.label === "not_interested" ? "on" : ""}" data-label="not_interested">Not interested <kbd>X</kbd></button>
      ${j.label ? '<button data-label="clear">Clear <kbd>U</kbd></button>' : ""}
      ${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">Open posting ↗</a>` : ""}
      <span class="match" style="color:var(--muted);margin-left:auto"><kbd>J</kbd>/<kbd>K</kbd> next / previous</span>
    </div>
    <div class="facts">${facts}${gates}</div>
    ${j.fit_score == null ? '<div class="card">This job has no fit score (it was filtered out before scoring).</div>' : `
    <div class="card"><h3>Fit score ${j.fit_score}${d.title_family ? " · " + esc(d.title_family.replace(/_/g, " ")) : ""}</h3>
      ${d.preference != null ? `<p style="margin:0 0 10px">Learned from your marks: <b>${Math.round(d.preference * 100)}%</b> likely to interest you
        <span class="match" style="color:var(--muted)">(model trained on ${d.model?.labels ?? "?"} marked jobs). The rule-based score below is ${d.rule_score}.</span></p>` : ""}
      <div class="comp">${comps}</div></div>`}
    ${req.length ? `<div class="card"><h3>Requirements, matched against your resume${d.sections_quality === "unlabelled" ? " (headings not recognised; all bullets shown)" : ""}</h3>${bulletList(req)}</div>` : ""}
    ${pref.length ? `<div class="card"><h3>Preferred</h3>${bulletList(pref)}</div>` : ""}
    ${other.map(s => `<div class="card"><h3>${esc(s.heading || "Other")}</h3><ul class="plain">${s.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`).join("")}
    ${j.comp_text ? `<div class="card"><h3>Pay, as stated</h3>${esc(j.comp_text)}</div>` : ""}
    <div class="card"><details><summary>Full posting text</summary><pre>${esc(j.description)}</pre></details></div>`;
  $("detail").scrollTop = 0;
}

async function mark(label) {
  if (selected == null) return;
  const id = selected, i = jobs.findIndex(j => j.id === id);
  await api(`/api/jobs/${id}/label`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({label})});
  if (i >= 0) jobs[i].label = label === "clear" ? null : label;
  loadSummary();
  const next = label !== "clear" && jobs[i + 1];
  renderList(jobs.length);
  select(next ? next.id : id);
}

function move(step) {
  const i = jobs.findIndex(j => j.id === selected), n = jobs[i + step];
  if (n) select(n.id);
}

$("list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) select(+r.dataset.id); });
$("detail").addEventListener("click", e => { const b = e.target.closest("button[data-label]"); if (b) mark(b.dataset.label); });
let timer;
for (const id of ["q", "company", "label", "min_score", "sort", "scope"])
  $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => loadJobs(false), 250); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "j" || k === "arrowdown") { e.preventDefault(); move(1); }
  else if (k === "k" || k === "arrowup") { e.preventDefault(); move(-1); }
  else if (k === "i") mark("interested");
  else if (k === "x") mark("not_interested");
  else if (k === "u") mark("clear");
});
loadSummary().then(() => loadJobs(false)).catch(e => { $("detail").innerHTML = `<div class="empty">Could not load jobs: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
