<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self Recruiter (AI)</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #dfe3e8; --text: #1c2330; --muted: #667085;
    --accent: #2f6fde; --yes: #1a8f5a; --yes-bg: #e3f5ec; --no: #c0392b; --no-bg: #fbe9e7;
    --sel: #e8f0fe; --bar: #c9d3e0; --warn: #b26a00; --warn-bg: #fff3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1a1f27; --line: #2c333f; --text: #e6e9ee; --muted: #94a0b3;
      --accent: #6ea0ff; --yes: #4cc38a; --yes-bg: #173327; --no: #f0776a; --no-bg: #3a1f1c;
      --sel: #22304a; --bar: #3a4455; --warn: #f0b354; --warn-bg: #3a2c12;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  #banner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 8px 18px;
            background: #000; color: #fff; }
  #banner .logo { height: 72px; width: auto; justify-self: start; filter: drop-shadow(0 0 10px rgba(255,140,40,.55)); }
  #banner .brandbox { text-align: center; }
  #banner .brand { font-size: 30px; font-weight: 800; letter-spacing: .01em; }
  #banner .brand span { font-weight: 700; color: #ffc857; }
  #banner .tagline { font-size: 13px; color: #c9c3bd; }
  #banner button { justify-self: end; background: #f46036; color: #fff; border: 0; font-weight: 700; padding: 8px 16px; cursor: pointer; }
  #banner button:hover { background: #ff7a50; }
  @media (max-width: 800px) { #banner .brand { font-size: 22px; } #banner .logo { height: 48px; } }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                          border-radius: 6px; padding: 5px 8px; }
  input[type=search] { width: 200px; }
  input[type=number] { width: 64px; }
  label.f { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #progress { margin-left: auto; color: var(--muted); white-space: nowrap; }
  #progress b { color: var(--text); }
  main { flex: 1; display: flex; min-height: 0; }
  #list { width: 420px; max-width: 45%; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  #detail { flex: 1; overflow-y: auto; padding: 20px 28px 60px; }
  .row { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; }
  .row:hover { background: var(--bg); }
  .row.sel { background: var(--sel); }
  .row .t { font-weight: 600; }
  .row .m { color: var(--muted); font-size: 12.5px; }
  .score { flex: none; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center;
           font-weight: 700; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .score.gated { color: var(--warn); border-color: var(--warn); }
  .row.interested { box-shadow: inset 4px 0 0 var(--yes); }
  .row.not_interested { box-shadow: inset 4px 0 0 var(--no); opacity: .6; }
  .count { padding: 6px 12px; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--line); }
  h2 { margin: 0 0 2px; font-size: 20px; }
  .titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .req { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .actions { display: flex; gap: 8px; margin: 14px 0 18px; flex-wrap: wrap; align-items: center; }
  .actions button { padding: 7px 14px; cursor: pointer; font-weight: 600; }
  .actions button.yes.on { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); }
  .actions button.no.on { background: var(--no-bg); border-color: var(--no); color: var(--no); }
  .actions a { color: var(--accent); margin-left: 6px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
  .chip.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .comp { display: grid; grid-template-columns: 120px 1fr 44px; gap: 6px 10px; align-items: center; font-size: 13px; }
  .track { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  ul.b { list-style: none; padding: 0; margin: 0; }
  ul.b li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  ul.b li:first-child { border-top: 0; }
  ul.b .s { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  ul.b .match { color: var(--muted); font-size: 12px; }
  ul.plain { margin: 0; padding-left: 18px; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; font: inherit; margin: 10px 0 0; }
  .tags { flex: none; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; font-size: 12px; }
  .heart { color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; background: none; border: 0; padding: 0; }
  .heart.on { color: var(--no); }
  .tag { border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 600; background: var(--yes-bg); color: var(--yes); border: 1px solid var(--yes); }
  .tag.note { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  .actions button.fav.on { background: var(--no-bg); border-color: var(--no); color: var(--no); }
  .actions button.app.on { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); }
  textarea { width: 100%; min-height: 90px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
  .saved { color: var(--muted); font-size: 12px; margin-top: 4px; min-height: 16px; }
  .fitrow { display: grid; grid-template-columns: 1fr 150px; gap: 14px; align-items: stretch; margin-bottom: 14px; }
  .fitrow .card { margin-bottom: 0; }
  .dial { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; }
  .dial svg { width: 120px; height: 72px; overflow: visible; }
  .dial .big { font-size: 26px; font-weight: 700; line-height: 1; margin-top: -30px; font-variant-numeric: tabular-nums; }
  .dial .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  @media (max-width: 800px) { .fitrow { grid-template-columns: 1fr; } }
  #runpanel { flex: 1; overflow-y: auto; padding: 20px 28px 60px; }
  .runform { display: flex; flex-direction: column; gap: 10px; }
  .runform label.f { display: grid; grid-template-columns: 90px 1fr; gap: 10px; }
  .runform textarea { min-height: 54px; }
  .runform .field { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; margin: 6px 0; }
  .runform .field .d { color: var(--muted); font-size: 12px; grid-column: 2; margin-top: -4px; }
  pre.log { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; max-height: 420px; overflow: auto; font: 12px ui-monospace, monospace; margin: 0; }
  .runrow { display: grid; grid-template-columns: 70px 1fr 140px; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .runrow:first-child { border-top: 0; }
  .runrow .ok { color: var(--yes); } .runrow .failed { color: var(--no); } .runrow .running { color: var(--warn); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  #dups { flex: 1; overflow-y: auto; padding: 20px 28px 60px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .pair .job { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .pair .job .t { font-weight: 600; }
  .pair .job .m { color: var(--muted); font-size: 12.5px; }
  .pairhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 12.5px; }
  .pairhead .btns button { margin-left: 6px; cursor: pointer; }
  @media (max-width: 800px) { main { flex-direction: column; } #list { width: 100%; max-width: none; height: 40%; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="banner">
  <img class="logo" src="/logo.png" alt="phoenix logo">
  <div class="brandbox"><div class="brand">Self Recruiter <span>(AI)</span></div><div class="tagline">finds, scores and tracks the roles worth your time</div></div>
  <button id="runbtn" title="Start a pull or run any tool">▶ Run</button>
</div>
<header>
  <input type="search" id="q" placeholder="Search title or text">
  <select id="company"><option value="">All companies</option></select>
  <select id="label">
    <option value="all">All jobs</option>
    <option value="unlabelled">Not yet marked</option>
    <option value="interested">Interested</option>
    <option value="not_interested">Not interested</option>
  </select>
  <select id="posted">
    <option value="any">Posted any time</option>
    <option value="24h">Past 24 hours</option>
    <option value="7d">Past week</option>
    <option value="30d">Past month</option>
  </select>
  <select id="flag">
    <option value="any">Any status</option>
    <option value="favorite">♥ Favorites</option>
    <option value="applied">Applied</option>
    <option value="not_applied">Not applied</option>
  </select>
  <label class="f">Min score <input type="number" id="min_score" min="0" max="100" value="0"></label>
  <select id="sort"><option value="score">Highest score</option><option value="newest">Newest</option></select>
  <label class="f"><input type="checkbox" id="scope"> include filtered-out jobs</label>
  <div id="progress"></div>
  <button id="dupbtn" title="Pairs that look like the same opening; decide whether they are">Possible duplicates</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a job on the left.</div></div>
  <div id="dups" hidden></div>
  <div id="runpanel" hidden>
    <h2>Run jobagent</h2>
    <div class="card">
      <div class="runform">
        <label class="f">Command
          <select id="run-cmd"><option value="pipeline">pipeline (orchestrator: pull + all stages)</option><option value="run">run a single tool</option></select>
        </label>
        <div id="run-pipeline">
          <label class="f" style="align-items:flex-start">Request<textarea id="run-request" rows="2">Pull at most 100 new postings per target from every configured source, posted in the last 24 hours.</textarea></label>
        </div>
        <div id="run-tool" hidden>
          <label class="f">Tool <select id="run-toolname"></select></label>
          <div id="run-tooldesc" class="sub"></div>
          <div id="run-fields"></div>
        </div>
        <div class="actions"><button id="run-start" class="yes on">Start</button><span id="run-msg" class="sub"></span></div>
      </div>
    </div>
    <div class="card" id="run-current" hidden>
      <div class="pairhead"><span id="run-title"></span><span class="btns"><button id="run-stop">Stop</button></span></div>
      <pre id="run-output" class="log"></pre>
    </div>
    <div class="card"><h3>Recent runs</h3><div id="run-list" class="sub">none yet</div></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let jobs = [], selected = null;

const money = j => {
  if (j.comp_min == null && j.comp_max == null) return "";
  const f = n => j.comp_period === "hour" ? "$" + n : "$" + Math.round(n / 1000) + "k";
  return f(j.comp_min ?? j.comp_max) + "–" + f(j.comp_max ?? j.comp_min) + (j.comp_period === "hour" ? "/hr" : "");
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadSummary() {
  const s = await api("/api/summary");
  const done = s.interested + s.not_interested;
  $("progress").innerHTML = `<b>${done}</b> of ${s.in_scope} marked · <b>${s.interested}</b> interested · <b>${s.not_interested}</b> not · <b>${s.favorites}</b> ♥ · <b>${s.applied}</b> applied`;
  $("dupbtn").textContent = `Possible duplicates (${s.pending_duplicates})`;
  const sel = $("company"), cur = sel.value;
  sel.innerHTML = '<option value="">All companies</option>' + s.companies.map(c => `<option>${esc(c)}</option>`).join("");
  sel.value = cur;
}

async function loadJobs(keep) {
  const p = new URLSearchParams({
    q: $("q").value, company: $("company").value, label: $("label").value, flag: $("flag").value, sort: $("sort").value, posted: $("posted").value,
    min_score: $("min_score").value || 0, scope: $("scope").checked ? "all" : "in_scope",
  });
  const data = await api("/api/jobs?" + p);
  jobs = data.jobs;
  renderList(data.total);
  if (keep && jobs.some(j => j.id === selected)) return;
  if (jobs.length) select(jobs[0].id); else { selected = null; $("detail").innerHTML = '<div class="empty">No jobs match these filters.</div>'; }
}

function renderList(total) {
  const shown = jobs.length < total ? `Showing ${jobs.length} of ${total} jobs` : `${total} jobs`;
  $("list").innerHTML = `<div class="count">${shown}</div>` + jobs.map(j => `
    <div class="row ${j.label || ""} ${j.id === selected ? "sel" : ""}" data-id="${j.id}">
      <div class="score ${j.gated ? "gated" : ""}" title="${j.gated ? "Capped by a hard gate" : "Fit score"}">${j.fit_score ?? "–"}</div>
      <div style="flex:1;min-width:0"><div class="t">${esc(j.title)}</div>
        <div class="m">${esc(j.company)}${j.location ? " · " + esc(j.location) : ""}</div>
        <div class="m">${[j.seniority !== "unknown" ? j.seniority : "", j.workplace !== "unknown" ? j.workplace : "", money(j), "posted " + j.posted].filter(Boolean).map(esc).join(" · ")}</div>
      </div>
      <div class="tags"><button class="heart ${j.favorite ? "on" : ""}" data-fav="${j.id}" title="Favorite (F)">${j.favorite ? "♥" : "♡"}</button>
        ${j.applied ? '<span class="tag">applied</span>' : ""}${j.has_notes ? '<span class="tag note">note</span>' : ""}</div>
    </div>`).join("");
}

async function select(id) {
  if (notesTimer && selected != null && selected !== id) { clearTimeout(notesTimer); const t = $("notes"); if (t) annotate(selected, {notes: t.value}); notesTimer = null; }
  selected = id;
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", +r.dataset.id === id));
  document.querySelector(".row.sel")?.scrollIntoView({block: "nearest"});
  const j = await api("/api/jobs/" + id);
  if (selected !== id) return;
  renderDetail(j);
}

function scoreColor(score) {           // 0 = red, 50 = amber, 100 = green
  return `hsl(${Math.round(score * 1.2)} 70% 42%)`;
}
function dial(score, gated) {
  // half-circle gauge: radius 50, centre (60,60), arc length = pi * 50
  const len = Math.PI * 50, filled = len * Math.max(0, Math.min(100, score)) / 100, color = scoreColor(score);
  return `<div class="card dial" title="${gated ? "Capped at 30 by a hard gate" : "Overall fit score"}">
    <svg viewBox="0 0 120 70" aria-label="fit score ${score}">
      <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="var(--bar)" stroke-width="12" stroke-linecap="round"/>
      <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${filled.toFixed(1)} ${len.toFixed(1)}"/>
    </svg>
    <div class="big" style="color:${color}">${score}</div>
    <div class="lbl">${gated ? "capped" : "fit"}</div></div>`;
}
function renderDetail(j) {
  const d = j.fit_details || {}, c = d.components || {};
  const names = {required: "Required match", preferred: "Preferred match", title_family: "Title family", seniority: "Seniority", domain: "Domain"};
  const comps = Object.keys(names).filter(k => k in c).map(k => `
    <div>${names[k]}</div><div class="track"><div class="fill" style="width:${Math.round(c[k] * 100)}%"></div></div><div class="num">${Math.round(c[k] * 100)}</div>`).join("");
  const bullets = label => (d.bullets || []).filter(b => b.label === label);
  const bulletList = bs => `<ul class="b">${bs.map(b => `<li><div class="s">${Math.round(b.score * 100)}</div>
      <div>${esc(b.text)}<div class="match">closest resume section: ${esc(b.matched)} (similarity ${b.similarity})</div></div></li>`).join("")}</ul>`;
  const facts = [
    j.location, j.workplace !== "unknown" && j.workplace, j.seniority !== "unknown" && j.seniority,
    j.employment_type && j.employment_type !== "unknown" && j.employment_type.replace("_", " "),
    j.min_years != null && j.min_years + "+ years", money(j),
    j.visa && j.visa !== "unstated" && "visa sponsorship: " + j.visa,
    j.posted ? "posted " + j.posted : "first seen " + j.first_seen,
  ].filter(Boolean).map(f => `<span class="chip">${esc(f)}</span>`).join("");
  const gates = (d.gates || []).map(g => `<span class="chip warn">capped at 30: ${esc(g)}</span>`).join("");
  const other = (j.sections || []).filter(s => s.label === "responsibilities" || s.label === "other");
  const req = bullets("required"), pref = bullets("preferred");
  $("detail").innerHTML = `
    <div class="titlerow"><h2>${esc(j.title)}</h2>${j.requisition_id ? `<span class="req" title="Requisition ID">Req ${esc(j.requisition_id)}</span>` : ""}</div>
    <div class="sub">${esc(j.company)}</div>
    <div class="actions">
      <button class="yes ${j.label === "interested" ? "on" : ""}" data-label="interested">Interested <kbd>I</kbd></button>
      <button class="no ${j.label === "not_interested" ? "on" : ""}" data-label="not_interested">Not interested <kbd>X</kbd></button>
      ${j.label ? '<button data-label="clear">Clear <kbd>U</kbd></button>' : ""}
      <button class="fav ${j.favorite ? "on" : ""}" data-annotate="favorite">${j.favorite ? "♥" : "♡"} Favorite <kbd>F</kbd></button>
      <button class="app ${j.applied_at ? "on" : ""}" data-annotate="applied">${j.applied_at ? "✓ Applied " + esc(j.applied_at) : "Mark applied"} <kbd>A</kbd></button>
      ${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">Open posting ↗</a>` : ""}
      <span class="match" style="color:var(--muted);margin-left:auto"><kbd>J</kbd>/<kbd>K</kbd> next / previous</span>
    </div>
    <div class="facts">${facts}${gates}</div>
    <div class="card"><h3>Your notes</h3><textarea id="notes" placeholder="Anything you want to remember about this job: who you spoke to, why it stands out, follow-ups…">${esc(j.notes)}</textarea><div class="saved" id="notes-saved"></div></div>
    ${j.fit_score == null ? '<div class="card">This job has no fit score (it was filtered out before scoring).</div>' : `
    <div class="fitrow">
    <div class="card"><h3>Fit score${d.title_family ? " · " + esc(d.title_family.replace(/_/g, " ")) : ""}</h3>
      ${d.preference != null ? `<p style="margin:0 0 10px">Learned from your marks: <b>${Math.round(d.preference * 100)}%</b> likely to interest you
        <span class="match" style="color:var(--muted)">(model trained on ${d.model?.labels ?? "?"} marked jobs). The rule-based score below is ${d.rule_score}.</span></p>` : ""}
      <div class="comp">${comps}</div></div>
    ${dial(j.fit_score, (d.gates || []).length > 0)}
    </div>`}
    ${req.length ? `<div class="card"><h3>Requirements, matched against your resume${d.sections_quality === "unlabelled" ? " (headings not recognised; all bullets shown)" : ""}</h3>${bulletList(req)}</div>` : ""}
    ${pref.length ? `<div class="card"><h3>Preferred</h3>${bulletList(pref)}</div>` : ""}
    ${other.map(s => `<div class="card"><h3>${esc(s.heading || "Other")}</h3><ul class="plain">${s.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`).join("")}
    ${(j.postings || []).length > 1 ? `<div class="card"><h3>${j.postings.length} postings merged into this job</h3><ul class="plain">${j.postings.map(p =>
      `<li>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title || "posting")}</a>` : esc(p.title || "posting")}${p.location ? " · " + esc(p.location) : ""} <span class="match" style="color:var(--muted)">(${esc(p.source)})</span></li>`).join("")}</ul></div>` : ""}
    ${j.comp_text ? `<div class="card"><h3>Pay, as stated</h3>${esc(j.comp_text)}</div>` : ""}
    <div class="card"><details><summary>Full posting text</summary><pre>${esc(j.description)}</pre></details></div>`;
  $("detail").scrollTop = 0;
}

async function mark(label) {
  if (selected == null) return;
  const id = selected, i = jobs.findIndex(j => j.id === id);
  await api(`/api/jobs/${id}/label`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({label})});
  if (i >= 0) jobs[i].label = label === "clear" ? null : label;
  loadSummary();
  const next = label !== "clear" && jobs[i + 1];
  renderList(jobs.length);
  select(next ? next.id : id);
}

async function annotate(id, body) {
  const r = await api(`/api/jobs/${id}/annotate`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = jobs.find(x => x.id === id);
  if (j) { j.favorite = r.favorite; j.applied = !!r.applied_at; j.has_notes = !!r.notes; }
  renderList(jobs.length);
  loadSummary();
  if (id === selected && (body.favorite != null || body.applied != null)) select(id);
  return r;
}
function toggle(kind) {
  if (selected == null) return;
  const j = jobs.find(x => x.id === selected);
  if (!j) return;
  annotate(selected, kind === "favorite" ? {favorite: !j.favorite} : {applied: !j.applied});
}
let notesTimer, notesFor;
function notesChanged() {
  const id = selected, text = $("notes").value;
  $("notes-saved").textContent = "…";
  clearTimeout(notesTimer);
  notesTimer = setTimeout(async () => {
    try {
      await annotate(id, {notes: text});
      if (selected === id) $("notes-saved").textContent = "Saved " + new Date().toLocaleTimeString();
    } catch (e) {
      if (selected === id) $("notes-saved").textContent = "Not saved: " + e.message.slice(0, 120) + " (is the server up to date? restart `jobagent ui`)";
    }
  }, 600);
}
function move(step) {
  const i = jobs.findIndex(j => j.id === selected), n = jobs[i + step];
  if (n) select(n.id);
}

let showingDups = false;
async function toggleDups() {
  showingDups = !showingDups;
  if (showingDups && showingRun) { showingRun = false; $("runpanel").hidden = true; clearTimeout(pollTimer); }
  $("detail").hidden = showingDups; $("dups").hidden = !showingDups;
  if (showingDups) renderDups();
}
async function renderDups() {
  const pairs = await api("/api/duplicates");
  const job = x => `<div class="job"><div class="t">${esc(x.title)}</div><div class="m">${esc(x.location || "no location")}${x.fit_score != null ? " · score " + x.fit_score : ""}${x.label ? " · " + esc(x.label.replace("_", " ")) : ""}</div></div>`;
  $("dups").innerHTML = pairs.length ? `<h2>Possible duplicates</h2><div class="sub">Same company, similar text. "Same opening" merges the pair into one record (both postings stay linked); "Different" keeps both.</div>` +
    pairs.map(p => `<div class="card" data-pair="${p.id}"><div class="pairhead"><span>${esc(p.company)} · similarity ${p.similarity.toFixed(3)}</span>
      <span class="btns"><button data-decision="same">Same opening</button><button data-decision="different">Different</button></span></div>
      <div class="pair">${job(p.a)}${job(p.b)}</div></div>`).join("")
    : '<div class="empty">No pending pairs.</div>';
}
$("dupbtn").addEventListener("click", toggleDups);

// ---- running jobagent from the page
let tools = [], showingRun = false, pollTimer, currentRun = null;
async function toggleRun() {
  showingRun = !showingRun;
  if (showingRun && showingDups) toggleDups();
  $("detail").hidden = showingRun; $("runpanel").hidden = !showingRun;
  if (showingRun) { if (!tools.length) await loadTools(); refreshRuns(); } else clearTimeout(pollTimer);
}
async function loadTools() {
  tools = await api("/api/tools");
  $("run-toolname").innerHTML = tools.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join("");
  renderToolForm();
}
function renderToolForm() {
  const t = tools.find(x => x.name === $("run-toolname").value); if (!t) return;
  $("run-tooldesc").textContent = t.description;
  $("run-fields").innerHTML = t.fields.map(f => {
    const id = "arg-" + f.name, label = `<label for="${id}">${esc(f.name)}${f.required ? " *" : ""}</label>`;
    let input;
    if (f.type === "bool") input = `<select id="${id}" data-arg="${esc(f.name)}" data-type="bool"><option value="">default${f.default != null ? " (" + f.default + ")" : ""}</option><option value="true">true</option><option value="false">false</option></select>`;
    else if (f.type.startsWith("choice:")) input = `<select id="${id}" data-arg="${esc(f.name)}"><option value="">default${f.default != null ? " (" + esc(f.default) + ")" : ""}</option>${f.type.slice(7).split(",").map(c => `<option>${esc(c)}</option>`).join("")}</select>`;
    else input = `<input id="${id}" data-arg="${esc(f.name)}" data-type="${f.type}" type="${f.type === "number" ? "number" : "text"}" placeholder="${f.default != null ? "default: " + esc(f.default) : (f.required ? "required" : "optional")}">`;
    return `<div class="field">${label}${input}<div class="d">${esc(f.description)}</div></div>`;
  }).join("") || '<div class="sub">This tool takes no arguments.</div>';
}
function toolArgs() {
  const args = {};
  for (const el of $("run-fields").querySelectorAll("[data-arg]")) {
    const v = el.value; if (v === "") continue;
    args[el.dataset.arg] = el.dataset.type === "bool" ? v === "true" : el.dataset.type === "number" ? Number(v) : v;
  }
  return args;
}
async function startRun() {
  const cmd = $("run-cmd").value;
  const body = cmd === "pipeline" ? {command: "pipeline", request: $("run-request").value} : {command: "run", tool: $("run-toolname").value, args: toolArgs()};
  $("run-msg").textContent = "";
  try { const r = await api("/api/runs", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}); watch(r.id); }
  catch (e) { $("run-msg").textContent = e.message.replace(/^.*"detail":"?/, "").replace(/"?}$/, ""); }
}
function watch(id) { currentRun = id; $("run-current").hidden = false; poll(); }
async function poll() {
  clearTimeout(pollTimer);
  if (!currentRun) return;
  const r = await api("/api/runs/" + currentRun);
  $("run-title").textContent = `${r.label} — ${r.status}${r.elapsed_s != null ? " · " + r.elapsed_s + "s" : ""}${r.exit_code != null ? " · exit " + r.exit_code : ""}`;
  const out = $("run-output"), atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
  out.textContent = r.output || "(no output yet)";
  if (atBottom) out.scrollTop = out.scrollHeight;
  $("run-stop").hidden = r.status !== "running";
  if (r.status === "running") pollTimer = setTimeout(poll, 2000);
  else { refreshRuns(); loadSummary(); loadJobs(true); }
}
async function refreshRuns() {
  const d = await api("/api/runs");
  if (d.running && !currentRun) watch(d.running.id);
  $("run-list").innerHTML = d.runs.length ? d.runs.map(r => `<div class="runrow" data-run="${r.id}"><span class="${r.status}">${r.status}</span><span>${esc(r.label)}</span><span>${r.started_at.slice(0, 16).replace("T", " ")}</span></div>`).join("") : "none yet";
}
$("runbtn").addEventListener("click", toggleRun);
$("run-cmd").addEventListener("change", () => { const p = $("run-cmd").value === "pipeline"; $("run-pipeline").hidden = !p; $("run-tool").hidden = p; });
$("run-toolname").addEventListener("change", renderToolForm);
$("run-start").addEventListener("click", startRun);
$("run-stop").addEventListener("click", async () => { if (currentRun) await api(`/api/runs/${currentRun}/stop`, {method: "POST"}); });
$("run-list").addEventListener("click", e => { const r = e.target.closest(".runrow"); if (r) watch(r.dataset.run); });
$("dups").addEventListener("click", async e => {
  const b = e.target.closest("button[data-decision]"); if (!b) return;
  const card = b.closest(".card");
  await api(`/api/duplicates/${card.dataset.pair}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({decision: b.dataset.decision})});
  card.remove(); loadSummary(); if (b.dataset.decision === "same") loadJobs(true);
});
$("list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) select(+r.dataset.id); });
$("detail").addEventListener("click", e => {
  const b = e.target.closest("button[data-label]"); if (b) return mark(b.dataset.label);
  const a = e.target.closest("button[data-annotate]"); if (a) toggle(a.dataset.annotate);
});
$("detail").addEventListener("input", e => { if (e.target.id === "notes") notesChanged(); });
$("list").addEventListener("click", e => {
  const h = e.target.closest("button[data-fav]");
  if (h) { e.stopPropagation(); const j = jobs.find(x => x.id === +h.dataset.fav); annotate(j.id, {favorite: !j.favorite}); }
}, true);
let timer;
for (const id of ["q", "company", "label", "flag", "posted", "min_score", "sort", "scope"])
  $(id).addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => loadJobs(false), 250); });
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "j" || k === "arrowdown") { e.preventDefault(); move(1); }
  else if (k === "k" || k === "arrowup") { e.preventDefault(); move(-1); }
  else if (k === "i") mark("interested");
  else if (k === "x") mark("not_interested");
  else if (k === "u") mark("clear");
  else if (k === "f") toggle("favorite");
  else if (k === "a") toggle("applied");
});
loadSummary().then(() => loadJobs(false)).catch(e => { $("detail").innerHTML = `<div class="empty">Could not load jobs: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
