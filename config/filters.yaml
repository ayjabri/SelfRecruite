# Pre-filter: decides which stored postings are worth an LLM extraction.
# Phrases match whole words, ignoring case. Edit freely, then run
#   jobagent run filter_pending_postings --recheck true
# to re-evaluate postings that have not been extracted yet.

title:
  # a posting is kept only if its title contains at least one of these...
  # (grouped by the Executive Profile variants in the golden-source resume)
  include:
    # Variant A — Product / Project Management & Business Analysis
    - product manager
    - product management
    - product owner
    - product lead
    - head of product
    - program manager
    - project manager
    - delivery manager
    - delivery lead
    - scrum master
    - business analyst
    - business analysis
    - business technology analyst
    - business systems analyst
    - solution design
    - solutions lead
    # Variant B — AI Product Management
    - ai product
    - ai implementation
    - ai transformation
    - ai program
    - ai strategy
    - ai enablement
    - ai adoption
    - ai solutions
    - agentic
    - ai platform
    # Variant C — Quantitative Analytics & Modeling
    - quantitative
    - quant
    - model validation
    - model risk
    - model development
    - modeling
    - modelling
    - risk analytics
    - analytics
    # Variant D — AI & Machine Learning
    - ai
    - ml
    - machine learning
    - llm
    - genai
    - generative ai
    - data scientist
    - data science
    - deep learning
    - nlp
    # Variant E — Treasury & ALM
    - treasury
    - alm
    - asset liability
    - asset/liability
    - liquidity
    - interest rate risk
    - interest rate
    - irrbb
    - balance sheet
    - nii
    - net interest income
    - funds transfer pricing
    - deposit
    - alco
    # Variant F — Technology & Engineering
    - python
    - software engineer
    - software engineering
    - data engineer
    - data engineering
    - analytics engineer
    - technical lead
    - tech lead
    - engineering lead
    - engineering manager
    - platform engineer
    - developer
    - treasury technology
    - technology lead
    - head of engineering
    - data platform
    - tableau
    - business intelligence
    - data analyst

  # ...and none of these
  exclude:
    - intern
    - interns
    - internship
    - internships
    - co-op
    - apprentice
    - phd
    - ph.d
    - postdoc
    - fellow
    - fellows
    - fellowship
    - recruiter
    - recruiting
    - sourcer
    - account executive
    - sales
    - teller
    - attorney
    - counsel
    - paralegal
    # PhD-gated quant research
    - quantitative research
    - quantitative researcher
    - quant research
    - quant researcher
    - research scientist

location:
  us_only: true      # drop postings clearly outside the US; unclear locations are kept
  extra_us: [New Jersey, New York, Jersey City, NYC, NJ]       # extra place names to treat as US, e.g. [Plano, Jersey City]
  extra_non_us: []   # extra place names to treat as non-US
