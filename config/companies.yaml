# Target employers per source. Each source agent reads its own section;
# the fields are the arguments of that source's fetch tool.
greenhouse:
  - anthropic

workday:   # site = tenant:wdN:site, from https://<tenant>.<wdN>.myworkdayjobs.com/<site>
  - {company: NVIDIA, site: nvidia:wd5:NVIDIAExternalCareerSite}
  - {company: Citi, site: citi:wd5:2}
  - {company: Capital One, site: capitalone:wd12:Capital_One}
  - {company: Bank Of America, site: ghr:wd1:Lateral-US}
  - {company: U.S. Bank, site: usbank:wd1:US_Bank_Careers}
  - {company: MUFG, site: mufgub:wd3:MUFG-Careers}
  - {company: Master Card, site: mastercard:wd1:CorporateCareers}
  - {company: Visa, site: visa:wd5:Visa}
  - {company: Barclays, site: barclays:wd3:External_Career_Site_Barclays}

oracle:    # host and site_number from https://<host>/hcmUI/CandidateExperience/en/sites/<site_number>
  - {company: JPMorgan Chase, host: jpmc.fa.oraclecloud.com, site_number: CX_1001}
  - {company: BNY, host: eofe.fa.us2.oraclecloud.com, site_number: BNY-Careers}
  - {company: Goldman Sachs, host: hdpc.fa.us2.oraclecloud.com, site_number: LateralHiring}
  - {company: Citizens Bank, host: hcgn.fa.us2.oraclecloud.com, site_number: CX_1}
