# Technical skills looked for in job postings, and which of them you have.
#
# skills:  canonical name -> phrases that mean it (matched whole-word, case-insensitive;
#          plain text, not regex, except that "." and "+" are handled).
# have:    skills you have that the resume text does not mention by these phrases.
# not_have: skills the resume mentions but you would rather not claim.
# Everything else in `have` is derived from your active resume.

