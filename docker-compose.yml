# SelfRecruite: Postgres (pgvector) + Ollama + the app.
#   cp .env.example .env    # then set POSTGRES_PASSWORD and, if you have one, a GPU override
#   docker compose up -d    # first start pulls the models; follow with: docker compose logs -f
# The page is at http://localhost:8765 (UI_BIND / UI_PORT in .env change that).
#
# No Ollama container wanted (you already run Ollama on the host)? Remove `ollama` from
# COMPOSE_PROFILES in .env and start with the host override:
#   docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up -d
# NVIDIA GPU for the Ollama container:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobagent}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # native installs and pg tools reach it here
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot: pulls the embedding model and, when LLM_MODEL is an Ollama model, the chat model.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-ollama:qwen3.6:27b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull "$$EMBED_MODEL"
        chat="$${LLM_MODEL#ollama:}"
        if [ "$$chat" != "$$LLM_MODEL" ]; then ollama pull "$$chat"; fi
        echo "models ready"
    restart: "no"

  app:
    build: .
    image: selfrecruite:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # inside the compose network the database and Ollama have fixed names
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobagent}
      OLLAMA_BASE_URL: http://ollama:11434
      # trust X-Forwarded-* from the Docker network (for a reverse proxy in another container)
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8765}:8765"
    volumes:
      - ./config:/app/config      # crawl list, filters, targets, skills: editable from Settings
      - ./data:/app/data          # run logs, config backups, an optional data/resume.md
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
